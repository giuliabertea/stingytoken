[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stingytoken"
version = "0.1.0"
description = "Reduce GitHub Copilot token usage via semantic context pruning and prompt compression"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "scikit-learn>=1.3",
    "pathspec>=0.11",
    "rich>=13.0",
    "requests>=2.28",
    "pyperclip>=1.8",
    'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]
openai = [
    "openai>=1.0",
]

[project.scripts]
stingytoken = "stingytoken.cli:cli"
